<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人简历</title>
    <style>
        body {
            font-family: "Microsoft Yahei", sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        table {
            border-collapse: collapse;
            width: 90%;
            margin: 0 auto;
            background: #fff;
        }
        table, th, td {
            border: 1px solid #999;
        }
        caption {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        td {
            padding: 10px;
            text-align: center;
        }
        .label {
            background-color: #e0e0e0;
            font-weight: bold;
        }
        .icon {
            margin-right: 5px;
        }
        .photo {
            width: 120px;
            height: 160px;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <table>
        <caption>个人简历</caption>
        <tr>
            <td class="label">姓名</td>
            <td>黄鹏</td>
            <td class="label">性别</td>
            <td>男</td>
            <td class="label">年龄</td>
            <td>20</td>
            <td rowspan="3" class="label">照片<br>
                <img src="OIP-C.jpg" alt="个人照片" class="photo">
            </td>
        </tr>
        <tr>
            <td class="label">籍贯</td>
            <td>山东菏泽</td>
            <td class="label">联系电话</td>
            <td>555555</td>
            <td class="label">电子邮箱</td>
            <td>3963542</td>
        </tr>
        <tr>
            <td class="label">学历</td>
            <td>本科</td>
            <td class="label">健康状况</td>
            <td>健康</td>
            <td class="label">婚姻状况</td>
            <td>未婚</td>
        </tr>
        <tr>
            <td class="label"><span class="icon">🎯</span>求职意向</td>
            <td colspan="2"></td>
            <td class="label"><span class="icon">📚</span>专业</td>
            <td colspan="2"></td>
            <td class="label"><span class="icon">🏫</span>毕业院校</td>
        </tr>
        <tr>
            <td class="label"><span class="icon">📜</span>技能证书</td>
            <td colspan="6"></td>
        </tr>
        <tr>
            <td class="label"><span class="icon">✨</span>个人特长与爱好</td>
            <td colspan="6"></td>
        </tr>
        <tr>
            <td class="label"><span class="icon">💼</span>项目经历</td>
            <td colspan="6" style="text-align: left; min-height: 80px;"></td>
        </tr>
        <tr>
            <td class="label"><span class="icon">📝</span>自我评价</td>
            <td colspan="6" style="text-align: left; min-height: 120px;">
                本人性格开朗、责任心强，具备良好的沟通协调能力与团队协作精神。在校期间系统学习了专业核心课程，掌握了前端开发基础技能，参与过多个课程项目实践，积累了一定的实战经验。对待工作认真严谨，乐于学习新知识、新技能，能够快速适应新环境，具备较强的问题解决能力和抗压能力，期望在相关岗位上持续提升自我，为企业创造价值。
            </td>
        </tr>
    </table>
</body>
</html>
